<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Gradient background -->
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FBBF24;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F59E0B;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect width="100" height="100" rx="20" fill="url(#grad)"/>

  <!-- Checkmark -->
  <path d="M 25 50 L 40 65 L 75 30"
        stroke="white"
        stroke-width="8"
        stroke-linecap="round"
        stroke-linejoin="round"
        fill="none"/>

  <!-- List lines -->
  <line x1="25" y1="20" x2="75" y2="20" stroke="white" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
  <line x1="25" y1="35" x2="65" y2="35" stroke="white" stroke-width="4" stroke-linecap="round" opacity="0.5"/>
</svg>
